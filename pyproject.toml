[project]
name = "arpe-pomapf"
version = "0.2.0"
description = "ARPE methods and planning baselines for lifelong POMAPF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.8.0",
    "sample-factory==2.1.1",
    "pogema==1.4.0",
    "gymnasium==0.28.1",
    "numpy==1.26.4",
    "pyyaml>=6.0",
    "pydantic==1.9.1",
    "cppimport>=22.8.2",
    "pybind11>=2.10",
]

[project.optional-dependencies]
baselines = [
    "Cython==0.29.28",
    "gym==0.10.5",
    "imageio==2.9.0",
    "protobuf==3.20.3",
    "setproctitle==1.2.2",
]
test = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agents",
    "learning",
    "maps",
    "planning",
    "pomapf_env",
]
py-modules = [
    "run_experiments",
    "train",
    "train_switcher_wait_arpe",
    "train_switcher_nowait",
]

[tool.setuptools.package-data]
maps = ["*.yaml"]
planning = ["planner.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".codex_backups", ".venv", "backups", "tmp"]
