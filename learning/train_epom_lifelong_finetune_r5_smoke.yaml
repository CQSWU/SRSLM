name: EPOM-Lifelong-Finetune-R5-Smoke

global_settings:
  train_dir: weights/EPOM-lifelong-finetune-r5-smoke
  device: gpu
  seed: 0

evaluation:
  env_frameskip: 1

experiment_settings:
  save_every_sec: 300
  save_best_every_sec: 300
  save_best_after: 100000
  save_best_metric: avg_throughput
  keep_checkpoints: 2
  encoder_custom: epom_finetune
  epom_base_weights_path: weights/EPOM/EPOM
  train_for_env_steps: 1048576
  train_for_seconds: 86400
  learning_rate: 0.0001
  lr_schedule: constant
  normalize_input: false
  hidden_size: 512
  pogema_encoder_num_filters: 64
  pogema_encoder_num_res_blocks: 3
  encoder_extra_fc_layers: 1

async_ppo:
  experiment_summaries_interval: 20
  adam_eps: 0.000001
  adam_beta1: 0.9
  adam_beta2: 0.999
  gae_lambda: 0.95
  num_epochs: 1
  max_grad_norm: 5.0
  batch_size: 4096
  num_workers: 2
  num_envs_per_worker: 2
  rollout: 32
  recurrence: 32
  with_vtrace: false
  num_batches_per_iteration: 1
  max_policy_lag: 100
  exploration_loss_coeff: 0.01
  value_loss_coeff: 0.5
  ppo_clip_ratio: 0.1
  with_pbt: false
  use_rnn: true
  rnn_type: gru
  rnn_num_layers: 1

environment:
  name: POMAPF-EPOM-v0
  grid_memory_obs_radius: 7
  grid_config:
    on_target: restart
    collision_system: block_both
    map_name: maps/train.yaml
    max_episode_steps: 512
    obs_radius: 5
    num_agents: 200
