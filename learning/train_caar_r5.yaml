name: CAAR-R5

global_settings:
  train_dir: weights/CAAR
  device: gpu
  seed: 0

evaluation:
  env_frameskip: 1

experiment_settings:
  save_every_sec: 259200
  save_best_every_sec: 259200
  save_best_after: 1000000000
  save_best_metric: avg_throughput
  keep_checkpoints: 1
  encoder_custom: caar
  train_for_env_steps: 500000000
  train_for_seconds: 604800
  hidden_size: 128
  caar_num_filters: 32
  caar_num_res_blocks: 3
  caar_tau_num_filters: 32
  caar_tau_num_conv_layers: 1
  caar_tau_num_res_blocks: 2
  caar_tau_hidden_size: 32
  caar_contextual_pressure: true
  lr_schedule: constant
  normalize_input: true
  normalize_input_keys:
    - obs
    - xy
    - target_xy

async_ppo:
  experiment_summaries_interval: 20
  num_epochs: 1
  max_grad_norm: 5.0
  batch_size: 4096
  num_workers: 22
  num_envs_per_worker: 2
  rollout: 32
  recurrence: 16
  with_vtrace: false
  num_batches_per_iteration: 1
  max_policy_lag: 300
  exploration_loss_coeff: 0.0
  with_pbt: false
  use_rnn: true

environment:
  name: POMAPF-ST-v0
  tau_rho: 0.1
  tau_radius: 5
  grid_config:
    on_target: restart
    collision_system: soft
    map_name: maps/train.yaml
    max_episode_steps: 512
    obs_radius: 5
    num_agents: 200
