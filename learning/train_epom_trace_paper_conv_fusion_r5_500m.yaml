name: EPOM-TracePaperConvDirectCorrection-R5-500M

global_settings:
  train_dir: weights/EPOM-TracePaperConvDirectCorrection-R5-500m
  device: gpu
  seed: 0

evaluation:
  env_frameskip: 1

experiment_settings:
  save_every_sec: 600
  save_best_every_sec: 600
  save_best_after: 1000000
  save_best_metric: avg_throughput
  keep_checkpoints: 20
  save_milestones_sec: 600
  encoder_custom: epom_trace_context
  trace_context_architecture: paper_entropy_fusion
  epom_base_weights_path: weights/EPOM-lifelong-finetune-r5/EPOM-Lifelong-Finetune-R5
  train_for_env_steps: 500000000
  train_for_seconds: 2592000
  learning_rate: 0.0001
  lr_schedule: constant
  normalize_input: false
  hidden_size: 512
  pogema_encoder_num_filters: 64
  pogema_encoder_num_res_blocks: 3
  encoder_extra_fc_layers: 1
  trace_rule_scale: 1.0
  trace_gate_threshold: 0.46371241
  trace_context_residual_cap: 2.0
  trace_context_learned_gate: entropy

async_ppo:
  experiment_summaries_interval: 20
  adam_eps: 0.000001
  adam_beta1: 0.9
  adam_beta2: 0.999
  gae_lambda: 0.95
  num_epochs: 1
  max_grad_norm: 5.0
  batch_size: 4096
  num_workers: 12
  num_envs_per_worker: 2
  rollout: 32
  recurrence: 32
  with_vtrace: false
  num_batches_per_iteration: 1
  max_policy_lag: 100
  exploration_loss_coeff: 0.01
  value_loss_coeff: 0.5
  ppo_clip_ratio: 0.1
  with_pbt: false
  use_rnn: true
  rnn_type: gru
  rnn_num_layers: 1

environment:
  name: POMAPF-EPOM-ST-v0
  tau_rho: 0.1
  tau_radius: 5
  tau_raw: false
  trace_variant: real
  trace_context_team_reward_coefficient: 0.0
  grid_memory_obs_radius: 7
  grid_config:
    on_target: restart
    collision_system: block_both
    map_name: maps/train_capacity_n600.yaml
    max_episode_steps: 512
    obs_radius: 5
    num_agents: 200
